<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supabase Table Viewer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container-dark">
    <h1>Таблица данных</h1>
    <p>Просмотр записей из Supabase</p>

    <div class="logs-container" style="margin-top: 0; border-top: none; padding-top: 0;">
      <div class="log-item">
        <span>Статус соединения</span>
        <span class="badge-success" id="statusBadge">CHECKING...</span>
      </div>
    </div>

    <div style="margin-top: 20px;">
      <table id="dataTable" style="width: 100%; border-collapse: collapse; text-align: left; font-size: 13px;">
        <thead>
          <tr style="border-bottom: 1px solid #1f2937; color: #94a3b8;">
            <th style="padding: 10px;">ID</th>
            <th style="padding: 10px;">Email</th>
            <th style="padding: 10px;">Создано</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr>
            <td colspan="3" style="padding: 15px; text-align: center; color: #94a3b8;">Загрузка данных...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://iizubwoxaposhzicoiiz.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_0LfD-klWybDlU2xrV_TSdA_z_QQI7jI';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const TABLE_STRUCTURE = {
      tableName: 'profiles',
      columns: [
        { name: 'id', type: 'uuid', primaryKey: true },
        { name: 'email', type: 'text', nullable: false },
        { name: 'created_at', type: 'timestamp', default: 'now()' }
      ]
    };

    document.addEventListener('DOMContentLoaded', async () => {
      const statusBadge = document.getElementById('statusBadge');
      const tableBody = document.getElementById('tableBody');

      console.log('Структура таблицы:', TABLE_STRUCTURE);

      try {
        const { data, error } = await supabaseClient.from(TABLE_STRUCTURE.tableName).select('*');
        
        if (error && error.code !== 'PGRST116') {
          throw error;
        }

        statusBadge.textContent = 'CONNECTED';
        statusBadge.style.color = '#3ecf8e';

        if (!data || data.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="3" style="padding: 15px; text-align: center; color: #94a3b8;">Таблица пуста</td></tr>`;
          return;
        }

        tableBody.innerHTML = '';
        data.forEach(row => {
          const tr = document.createElement('tr');
          tr.style.borderBottom = '1px solid #1f2937';
          tr.innerHTML = `
            <td style="padding: 10px; color: #e2e8f0;">${row.id || ''}</td>
            <td style="padding: 10px; color: #e2e8f0;">${row.email || ''}</td>
            <td style="padding: 10px; color: #94a3b8;">${row.created_at ? new Date(row.created_at).toLocaleString() : ''}</td>
          `;
          tableBody.appendChild(tr);
        });

      } catch (err) {
        console.error(err);
        statusBadge.textContent = 'OFFLINE';
        statusBadge.style.color = '#ef4444';
        tableBody.innerHTML = `<tr><td colspan="3" style="padding: 15px; text-align: center; color: #ef4444;">Ошибка загрузки данных</td></tr>`;
      }
    });
  </script>
</body>
</html>
