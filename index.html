<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог products</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .info-bar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
    }
    .info-card {
      flex: 1;
      padding: 12px 16px;
      background-color: #0b0f19;
      border: 1px solid #374151;
      border-radius: 8px;
      color: #ffffff;
      font-size: 14px;
      text-align: center;
    }
    .info-card span {
      color: #3ecf8e;
      font-weight: bold;
    }
    .table-wrapper {
      max-height: 400px;
      overflow-y: auto;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }
    th, td {
      padding: 12px;
      border-bottom: 1px solid #1f2937;
    }
    th {
      color: #94a3b8;
      position: sticky;
      top: 0;
      background-color: #111827;
    }
    td {
      color: #e2e8f0;
    }
  </style>
</head>
<body>

  <div class="container-dark" style="max-width: 850px;">
    <h1>Каталог products</h1>
    <p>Информация о структуре и данных из Supabase</p>

    <!-- Блок со счетчиками столбцов и таблиц (строк) -->
    <div class="info-bar">
      <div class="info-card">
        Столбцов: <span id="colCount">5</span>
      </div>
      <div class="info-card">
        Строк в таблице: <span id="rowCount">0</span>
      </div>
      <div class="info-card">
        Статус: <span id="statusBadge" style="color: #3ecf8e;">ONLINE</span>
      </div>
    </div>

    <div class="table-wrapper">
      <table id="dataTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr>
            <td colspan="5" style="text-align: center; color: #94a3b8;">Загрузка данных...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://iizubwoxaposhzicoiiz.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_0LfD-klWybDlU2xrV_TSdA_z_QQI7jI';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const tableName = 'products'; 

    async function fetchData() {
      const tableBody = document.getElementById('tableBody');
      const rowCountEl = document.getElementById('rowCount');
      
      try {
        const { data, error } = await supabaseClient.from(tableName).select('*');
        if (error) throw error;

        const rows = data || [];
        rowCountEl.textContent = rows.length;

        if (rows.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #94a3b8;">Таблица пуста</td></tr>`;
          return;
        }

        tableBody.innerHTML = rows.map(row => {
          return `<tr>
            <td>${row.id ?? ''}</td>
            <td>${row.name ?? ''}</td>
            <td>${row.price ?? ''}</td>
            <td>${row.quantity ?? ''}</td>
            <td>${row.total ?? ''}</td>
          </tr>`;
        }).join('');

      } catch (err) {
        console.error(err);
        tableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #ef4444;">Ошибка: ${err.message}</td></tr>`;
      }
    }

    document.addEventListener('DOMContentLoaded', fetchData);
  </script>
</body>
</html>
