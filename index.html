<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supabase App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container-dark">
    <h1>Авторизация</h1>
    <p>Подключение к Supabase</p>

    <div class="input-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com">
    </div>

    <div class="input-group">
      <label for="password">Пароль</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>

    <button class="btn-neon" id="submitBtn">Войти</button>

    <div class="logs-container">
      <div class="log-item">
        <span>Статус соединения</span>
        <span class="badge-success" id="statusBadge">CHECKING...</span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://iizubwoxaposhzicoiiz.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_0LfD-klWybDlU2xrV_TSdA_z_QQI7jI';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.addEventListener('DOMContentLoaded', async () => {
      const statusBadge = document.getElementById('statusBadge');
      const submitBtn = document.getElementById('submitBtn');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');

      try {
        const { error } = await supabaseClient.from('profiles').select('*').limit(1);
        if (error && error.code !== 'PGRST116') {
          statusBadge.textContent = 'ONLINE';
          statusBadge.style.color = '#3ecf8e';
        } else {
          statusBadge.textContent = 'CONNECTED';
          statusBadge.style.color = '#3ecf8e';
        }
      } catch (err) {
        statusBadge.textContent = 'OFFLINE';
        statusBadge.style.color = '#ef4444';
      }

      submitBtn.addEventListener('click', async () => {
        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();

        if (!email || !password) {
          alert('Заполните все поля!');
          return;
        }

        submitBtn.textContent = 'Загрузка...';
        submitBtn.disabled = true;

        try {
          const { data, error } = await supabaseClient.auth.signInWithPassword({
            email,
            password,
          });

          if (error) throw error;

          alert('Успешный вход!');
          console.log(data);
        } catch (error) {
          alert('Ошибка: ' + error.message);
        } finally {
          submitBtn.textContent = 'Войти';
          submitBtn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
