<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог и поиск</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .search-container {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    .search-container input, .search-container select {
      flex: 1;
      padding: 12px 16px;
      background-color: #0b0f19;
      border: 1px solid #374151;
      border-radius: 8px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }
    .search-container input:focus, .search-container select:focus {
      border-color: #3ecf8e;
      box-shadow: 0 0 0 3px rgba(62, 207, 142, 0.15);
    }
  </style>
</head>
<body>

  <div class="container-dark" style="max-width: 700px;">
    <h1>Каталог данных</h1>
    <p>Поиск по таблице Supabase</p>

    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Введите для поиска...">
      <select id="statusBadge" style="cursor: default;">
        <option>ONLINE</option>
      </select>
    </div>

    <div style="overflow-x: auto;">
      <table id="dataTable" style="width: 100%; border-collapse: collapse; text-align: left; font-size: 14px;">
        <thead>
          <tr style="border-bottom: 1px solid #1f2937; color: #94a3b8;">
            <th style="padding: 12px;">ID</th>
            <th style="padding: 12px;">Email / Название</th>
            <th style="padding: 12px;">Дата</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr>
            <td colspan="3" style="padding: 20px; text-align: center; color: #94a3b8;">Загрузка данных...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://iizubwoxaposhzicoiiz.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_0LfD-klWybDlU2xrV_TSdA_z_QQI7jI';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const tableName = 'profiles'; // Измените на название вашей таблицы, если нужно

    let allData = [];

    async function fetchData() {
      const tableBody = document.getElementById('tableBody');
      try {
        const { data, error } = await supabaseClient.from(tableName).select('*');
        if (error) throw error;

        allData = data || [];
        renderTable(allData);
      } catch (err) {
        console.error(err);
        tableBody.innerHTML = `<tr><td colspan="3" style="padding: 20px; text-align: center; color: #ef4444;">Ошибка загрузки данных</td></tr>`;
      }
    }

    function renderTable(data) {
      const tableBody = document.getElementById('tableBody');
      if (data.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="3" style="padding: 20px; text-align: center; color: #94a3b8;">Ничего не найдено</td></tr>`;
        return;
      }

      tableBody.innerHTML = '';
      data.forEach(row => {
        const tr = document.createElement('tr');
        tr.style.borderBottom = '1px solid #1f2937';
        tr.innerHTML = `
          <td style="padding: 12px; color: #e2e8f0;">${row.id || ''}</td>
          <td style="padding: 12px; color: #e2e8f0;">${row.email || row.title || '—'}</td>
          <td style="padding: 12px; color: #94a3b8;">${row.created_at ? new Date(row.created_at).toLocaleString() : '—'}</td>
        `;
        tableBody.appendChild(tr);
      });
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = allData.filter(row => {
        const val1 = String(row.id || '').toLowerCase();
        const val2 = String(row.email || row.title || '').toLowerCase();
        return val1.includes(query) || val2.includes(query);
      });
      renderTable(filtered);
    });

    document.addEventListener('DOMContentLoaded', fetchData);
  </script>
</body>
</html>
